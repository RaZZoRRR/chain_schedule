<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CHAIN SCHEDULE</title>

    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #0d1117;
            color: #ffffff;
            min-height: 100vh;
        }

        .container {
            width: min(1200px, 94%);
            margin: 0 auto;
            padding: 40px 0 60px;
        }

        /* =========================
           HEADER
        ========================= */

        header {
            text-align: center;
            margin-bottom: 40px;
        }

        h1 {
            font-size: clamp(32px, 6vw, 56px);
            letter-spacing: 3px;
            margin-bottom: 12px;
        }

        .date {
            font-size: 18px;
            color: #aeb7c4;
            margin-bottom: 6px;
        }

        .clock {
            font-size: 26px;
            font-weight: bold;
            letter-spacing: 2px;
        }

        /* =========================
           CONNECTION STATUS
        ========================= */

        .connection-status {
            text-align: center;
            margin-top: 10px;
            font-size: 13px;
            color: #7ee787;
        }

        .connection-status.error {
            color: #ff7b72;
        }

        /* =========================
           SCHEDULE
        ========================= */

        .schedule {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 18px;
        }

        .column {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 14px;
            overflow: hidden;
            min-height: 350px;
            display: flex;
            flex-direction: column;
        }

        .column-header {
            background: #21262d;
            padding: 20px 15px;
            text-align: center;
            font-size: 21px;
            font-weight: bold;
            letter-spacing: 1px;
            border-bottom: 1px solid #30363d;
        }

        .entries {
            padding: 15px;
            flex: 1;
        }

        .entry {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 11px 8px;
            margin-bottom: 7px;
            background: #0d1117;
            border-radius: 8px;
            border: 1px solid #21262d;
        }

        .entry-text {
            font-size: 15px;
            line-height: 1.4;
            word-break: break-word;
        }

        .delete-btn {
            flex-shrink: 0;
            border: none;
            background: transparent;
            color: #ff6b6b;
            font-size: 16px;
            cursor: pointer;
            padding: 4px 5px;
            border-radius: 5px;
        }

        .delete-btn:hover {
            background: #2d1616;
        }

        .empty {
            text-align: center;
            color: #6e7681;
            padding: 30px 10px;
            font-size: 14px;
        }

        .total {
            padding: 18px 15px;
            border-top: 1px solid #30363d;
            text-align: center;
            font-size: 19px;
            font-weight: bold;
        }

        /* =========================
           BUTTONS
        ========================= */

        .main-actions {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-top: 30px;
        }

        .primary-btn {
            border: none;
            border-radius: 9px;
            background: #ffffff;
            color: #0d1117;
            padding: 15px 28px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            letter-spacing: 0.5px;
        }

        .main-actions .primary-btn {
            text-decoration: none;
            display: inline-block;
        }

        .primary-btn:hover {
            opacity: 0.85;
        }

        .primary-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* =========================
           FORM
        ========================= */

        .form-section {
            max-width: 650px;
            margin: 55px auto 0;
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 14px;
            padding: 30px;
            display: none;
        }

        .form-section.visible {
            display: block;
        }

        .form-title {
            text-align: center;
            font-size: 25px;
            margin-bottom: 25px;
            letter-spacing: 1px;
        }

        .form-group {
            margin-bottom: 22px;
        }

        label {
            display: block;
            margin-bottom: 9px;
            font-size: 15px;
            font-weight: bold;
        }

        input[type="text"],
        select {
            width: 100%;
            padding: 13px;
            border-radius: 8px;
            border: 1px solid #30363d;
            background: #0d1117;
            color: white;
            font-size: 15px;
            outline: none;
        }

        input[type="text"]:focus,
        select:focus {
            border-color: #8b949e;
        }

        /* =========================
           TIME OPTIONS
        ========================= */

        .time-options {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }

        .time-option input {
            display: none;
        }

        .time-option span {
            display: block;
            text-align: center;
            padding: 13px 8px;
            border: 1px solid #30363d;
            border-radius: 8px;
            cursor: pointer;
            background: #0d1117;
            font-size: 14px;
            transition: 0.2s;
        }

        .time-option span:hover {
            border-color: #8b949e;
        }

        .time-option input:checked + span {
            background: #ffffff;
            color: #0d1117;
            border-color: #ffffff;
            font-weight: bold;
        }

        /* =========================
           CHECKBOX
        ========================= */

        .checkbox-wrapper {
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            user-select: none;
        }

        .checkbox-wrapper input {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        .checkbox-wrapper span {
            font-size: 15px;
        }

        /* =========================
           FORM BUTTONS
        ========================= */

        .form-buttons {
            display: flex;
            gap: 10px;
            margin-top: 28px;
        }

        .form-buttons button {
            flex: 1;
        }

        .secondary-btn {
            border: 1px solid #30363d;
            border-radius: 9px;
            background: transparent;
            color: #ffffff;
            padding: 14px;
            font-size: 15px;
            cursor: pointer;
        }

        .secondary-btn:hover {
            background: #21262d;
        }

        /* =========================
           MESSAGE
        ========================= */

        .message {
            text-align: center;
            margin-top: 15px;
            min-height: 20px;
            font-size: 14px;
        }

        .success {
            color: #7ee787;
        }

        .error {
            color: #ff7b72;
        }

        /* =========================
           LOADING
        ========================= */

        .loading {
            text-align: center;
            color: #8b949e;
            padding: 30px 10px;
            font-size: 14px;
        }

        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 800px) {

            .schedule {
                grid-template-columns: 1fr;
            }

            .column {
                min-height: auto;
            }

            .time-options {
                grid-template-columns: 1fr;
            }

            .form-section {
                padding: 22px;
            }

            .container {
                padding-top: 25px;
            }

        }
    </style>
</head>

<body>

<div class="container">

    <!-- HEADER -->

    <header>

        <h1>CHAIN SCHEDULE</h1>

        <div
            class="date"
            id="date"
        ></div>

        <div
            class="clock"
            id="clock"
        ></div>

        <div
            class="connection-status"
            id="connectionStatus"
        >
            Connecting...
        </div>

    </header>


    <!-- =========================
         SCHEDULE
    ========================== -->

    <section class="schedule">

        <!-- 12:00 -->

        <div class="column">

            <div class="column-header">
                12:00 TCT
            </div>

            <div
                class="entries"
                id="entries-12"
            >
                <div class="loading">
                    Loading...
                </div>
            </div>

            <div
                class="total"
                id="total-12"
            >
                Total Hits: 0
            </div>

        </div>


        <!-- 17:00 -->

        <div class="column">

            <div class="column-header">
                17:00 TCT
            </div>

            <div
                class="entries"
                id="entries-17"
            >
                <div class="loading">
                    Loading...
                </div>
            </div>

            <div
                class="total"
                id="total-17"
            >
                Total Hits: 0
            </div>

        </div>


        <!-- 00:00 -->

        <div class="column">

            <div class="column-header">
                00:00 TCT
            </div>

            <div
                class="entries"
                id="entries-00"
            >
                <div class="loading">
                    Loading...
                </div>
            </div>

            <div
                class="total"
                id="total-00"
            >
                Total Hits: 0
            </div>

        </div>

    </section>


    <!-- =========================
         VERIFY BUTTON
    ========================== -->

    <div class="main-actions">

        <button
            class="primary-btn"
            id="showFormBtn"
            onclick="showForm()"
        >
            VERIFY PARTICIPATION
        </button>

        <a
            class="primary-btn"
            href="https://razzorrr.github.io/TooMuchIncome_list/?api-key=FyXbmQVU4EnLcdIH"
            target="_blank"
            rel="noopener noreferrer"
        >
            Extra targets
        </a>

    </div>


    <!-- =========================
         FORM
    ========================== -->

    <section
        class="form-section"
        id="formSection"
    >

        <div class="form-title">
            VERIFY PARTICIPATION
        </div>


        <form id="participationForm">

            <!-- TIME -->

            <div class="form-group">

                <label>
                    Choose time
                </label>

                <div class="time-options">

                    <label class="time-option">

                        <input
                            type="radio"
                            name="time"
                            value="12"
                            required
                        >

                        <span>
                            12:00 TCT
                        </span>

                    </label>


                    <label class="time-option">

                        <input
                            type="radio"
                            name="time"
                            value="17"
                        >

                        <span>
                            17:00 TCT
                        </span>

                    </label>


                    <label class="time-option">

                        <input
                            type="radio"
                            name="time"
                            value="00"
                        >

                        <span>
                            00:00 TCT
                        </span>

                    </label>

                </div>

            </div>


            <!-- NICKNAME -->

            <div class="form-group">

                <label for="nickname">
                    Nickname
                </label>

                <input
                    type="text"
                    id="nickname"
                    maxlength="30"
                    placeholder="Enter your nickname"
                    autocomplete="off"
                    required
                >

            </div>


            <!-- QUANTITY -->

            <div class="form-group">

                <label for="quantity">
                    Quantity
                </label>

                <select
                    id="quantity"
                    required
                >

                    <option value="">
                        Select quantity
                    </option>

                    <option value="1">1</option>
                    <option value="2">2</option>
                    <option value="3">3</option>
                    <option value="4">4</option>
                    <option value="5">5</option>
                    <option value="6">6</option>

                </select>

            </div>


            <!-- CHECKBOX -->

            <div class="form-group">

                <label class="checkbox-wrapper">

                    <input
                        type="checkbox"
                        id="canTakeIt"
                    >

                    <span>
                        Can xan
                    </span>

                </label>

            </div>


            <!-- BUTTONS -->

            <div class="form-buttons">

                <button
                    type="submit"
                    class="primary-btn"
                    id="submitBtn"
                >
                    SUBMIT
                </button>

                <button
                    type="button"
                    class="secondary-btn"
                    onclick="hideForm()"
                >
                    BACK TO STATISTICS
                </button>

            </div>


            <div
                class="message"
                id="message"
            ></div>

        </form>

    </section>

</div>


<script>

    /* =====================================================
       SUPABASE CONFIGURATION
       =====================================================

       Replace these two values with your own Supabase
       project URL and publishable/anon key.

       NEVER put the service_role key here.
    ===================================================== */

    const SUPABASE_URL =
        "https://dsknucquniwmaogpbyax.supabase.co";

    const SUPABASE_KEY =
        "sb_publishable_CxUR4WE-nJtN5JstJNeF-Q_PSShAYto";


    /* =====================================================
       SUPABASE CLIENT
    ===================================================== */

    const supabaseClient =
        window.supabase.createClient(
            SUPABASE_URL,
            SUPABASE_KEY
        );


    /* =====================================================
       DATE & CLOCK — TCT
    ===================================================== */

    function updateClock() {

        const now = new Date();

        const dateOptions = {

            timeZone: "Etc/GMT",

            weekday: "long",

            day: "numeric",

            month: "long",

            year: "numeric"

        };


        const timeOptions = {

            timeZone: "Etc/GMT",

            hour: "2-digit",

            minute: "2-digit",

            second: "2-digit",

            hour12: false

        };


        const dateText =
            new Intl.DateTimeFormat(
                "en-GB",
                dateOptions
            ).format(now);


        const timeText =
            new Intl.DateTimeFormat(
                "en-GB",
                timeOptions
            ).format(now);


        document.getElementById(
            "date"
        ).textContent = dateText;


        document.getElementById(
            "clock"
        ).textContent =
            timeText + " TCT";

    }


    updateClock();

    setInterval(
        updateClock,
        1000
    );


    /* =====================================================
       CONNECTION STATUS
    ===================================================== */

    function setConnectionStatus(
        text,
        isError = false
    ) {

        const element =
            document.getElementById(
                "connectionStatus"
            );


        element.textContent = text;


        if (isError) {

            element.classList.add(
                "error"
            );

        } else {

            element.classList.remove(
                "error"
            );

        }

    }


    /* =====================================================
       LOAD PARTICIPANTS
    ===================================================== */

    async function loadParticipants() {

        setConnectionStatus(
            "Loading schedule..."
        );


        const {
            data,
            error
        } = await supabaseClient

            .from("participants")

            .select("*")

            .order(
                "created_at",
                {
                    ascending: true
                }
            );


        if (error) {

            console.error(
                "Supabase error:",
                error
            );


            setConnectionStatus(
                "Database connection error",
                true
            );


            showDatabaseError(
                error.message
            );


            return;

        }


        renderSchedule(data || []);


        setConnectionStatus(
            "Live schedule"
        );

    }


    /* =====================================================
       RENDER SCHEDULE
    ===================================================== */

    function renderSchedule(
        participants
    ) {

        const columns = {

            "12":
                document.getElementById(
                    "entries-12"
                ),

            "17":
                document.getElementById(
                    "entries-17"
                ),

            "00":
                document.getElementById(
                    "entries-00"
                )

        };


        const totals = {

            "12":
                document.getElementById(
                    "total-12"
                ),

            "17":
                document.getElementById(
                    "total-17"
                ),

            "00":
                document.getElementById(
                    "total-00"
                )

        };


        /* CLEAR */

        Object.values(columns)
            .forEach(
                column => {

                    column.innerHTML = "";

                }
            );


        const totalHits = {

            "12": 0,

            "17": 0,

            "00": 0

        };


        /* ENTRIES */

        participants.forEach(
            participant => {

                const time =
                    participant.time_slot;


                const column =
                    columns[time];


                if (!column) {

                    return;

                }


                /* TOTAL */

                totalHits[time] +=
                    Number(
                        participant.quantity
                    );


                if (
                    participant.can_take_it
                ) {

                    totalHits[time] += 10;

                }


                /* ENTRY */

                const entry =
                    document.createElement(
                        "div"
                    );

                entry.className =
                    "entry";


                /* DELETE */

                const deleteButton =
                    document.createElement(
                        "button"
                    );

                deleteButton.className =
                    "delete-btn";

                deleteButton.textContent =
                    "🗑";

                deleteButton.title =
                    "Delete entry";


                deleteButton.onclick =
                    function() {

                        deleteParticipant(
                            participant.id
                        );

                    };


                /* TEXT */

                const text =
                    document.createElement(
                        "div"
                    );

                text.className =
                    "entry-text";


                if (
                    participant.can_take_it
                ) {

                    text.textContent =
                        participant.nickname +
                        " — Can Xan — " +
                        participant.quantity;

                } else {

                    text.textContent =
                        participant.nickname +
                        " — " +
                        participant.quantity;

                }


                entry.appendChild(
                    deleteButton
                );

                entry.appendChild(
                    text
                );


                column.appendChild(
                    entry
                );

            }
        );


        /* EMPTY */

        Object.keys(columns)
            .forEach(
                time => {

                    if (
                        columns[time]
                            .children.length === 0
                    ) {

                        const empty =
                            document.createElement(
                                "div"
                            );

                        empty.className =
                            "empty";

                        empty.textContent =
                            "No participants yet";


                        columns[time]
                            .appendChild(
                                empty
                            );

                    }

                }
            );


        /* TOTAL */

        Object.keys(totals)
            .forEach(
                time => {

                    totals[time]
                        .textContent =
                        "Total Hits: " +
                        totalHits[time];

                }
            );

    }


    /* =====================================================
       ADD PARTICIPANT
    ===================================================== */

    document
        .getElementById(
            "participationForm"
        )
        .addEventListener(
            "submit",
            async function(event) {

                event.preventDefault();


                const submitButton =
                    document.getElementById(
                        "submitBtn"
                    );


                const selectedTime =
                    document.querySelector(
                        'input[name="time"]:checked'
                    );


                const nickname =
                    document.getElementById(
                        "nickname"
                    )
                    .value
                    .trim();


                const quantity =
                    Number(
                        document.getElementById(
                            "quantity"
                        ).value
                    );


                const canTakeIt =
                    document.getElementById(
                        "canTakeIt"
                    ).checked;


                /* VALIDATION */

                if (!selectedTime) {

                    showError(
                        "Please choose a time."
                    );

                    return;

                }


                if (!nickname) {

                    showError(
                        "Please enter your nickname."
                    );

                    return;

                }


                if (
                    !Number.isInteger(
                        quantity
                    ) ||
                    quantity < 1 ||
                    quantity > 6
                ) {

                    showError(
                        "Quantity must be between 1 and 6."
                    );

                    return;

                }


                /* DISABLE BUTTON */

                submitButton.disabled = true;

                submitButton.textContent =
                    "SUBMITTING...";


                /* INSERT */

                const {
                    data,
                    error
                } = await supabaseClient

                    .from("participants")

                    .insert({

                        time_slot:
                            selectedTime.value,

                        nickname:
                            nickname,

                        quantity:
                            quantity,

                        can_take_it:
                            canTakeIt

                    })

                    .select()
                    .single();


                if (error) {

                    console.error(
                        "Insert error:",
                        error
                    );


                    showError(
                        "Could not save participation: " +
                        error.message
                    );


                    submitButton.disabled =
                        false;

                    submitButton.textContent =
                        "SUBMIT";

                    return;

                }


                /* SUCCESS */

                showSuccess(
                    "Participation verified successfully!"
                );


                /* RESET */

                document
                    .getElementById(
                        "participationForm"
                    )
                    .reset();


                /* RELOAD DATA */

                await loadParticipants();


                /* BUTTON */

                submitButton.disabled =
                    false;

                submitButton.textContent =
                    "SUBMIT";


                /* RETURN */

                setTimeout(
                    function() {

                        hideForm();

                        document.getElementById(
                            "message"
                        ).textContent = "";

                    },
                    900
                );

            }
        );


    /* =====================================================
       DELETE PARTICIPANT
    ===================================================== */

    async function deleteParticipant(
        id
    ) {

        const confirmed =
            confirm(
                "Delete this participation?"
            );


        if (!confirmed) {

            return;

        }


        const {
            error
        } = await supabaseClient

            .from("participants")

            .delete()

            .eq(
                "id",
                id
            );


        if (error) {

            console.error(
                "Delete error:",
                error
            );


            alert(
                "Could not delete entry:\n" +
                error.message
            );


            return;

        }


        await loadParticipants();

    }


    /* =====================================================
       SHOW FORM
    ===================================================== */

    function showForm() {

        const form =
            document.getElementById(
                "formSection"
            );


        form.classList.add(
            "visible"
        );


        form.scrollIntoView({
            behavior: "smooth",
            block: "start"
        });

    }


    /* =====================================================
       HIDE FORM
    ===================================================== */

    function hideForm() {

        const form =
            document.getElementById(
                "formSection"
            );


        form.classList.remove(
            "visible"
        );


        window.scrollTo({

            top: 0,

            behavior: "smooth"

        });

    }


    /* =====================================================
       MESSAGES
    ===================================================== */

    function showError(
        text
    ) {

        const message =
            document.getElementById(
                "message"
            );


        message.className =
            "message error";


        message.textContent =
            text;

    }


    function showSuccess(
        text
    ) {

        const message =
            document.getElementById(
                "message"
            );


        message.className =
            "message success";


        message.textContent =
            text;

    }


    /* =====================================================
       DATABASE ERROR
    ===================================================== */

    function showDatabaseError(
        error
    ) {

        const columns = [

            document.getElementById(
                "entries-12"
            ),

            document.getElementById(
                "entries-17"
            ),

            document.getElementById(
                "entries-00"
            )

        ];


        columns.forEach(
            column => {

                column.innerHTML = "";

                const element =
                    document.createElement(
                        "div"
                    );

                element.className =
                    "empty";


                element.textContent =
                    "Database connection error";


                column.appendChild(
                    element
                );

            }
        );


        console.error(
            "Database:",
            error
        );

    }


    /* =====================================================
       REALTIME UPDATES
       =====================================================

       When someone adds or deletes a record,
       other open pages update automatically.
    ===================================================== */

    supabaseClient

        .channel(
            "participants-live"
        )

        .on(

            "postgres_changes",

            {
                event: "*",

                schema: "public",

                table: "participants"

            },

            function() {

                loadParticipants();

            }

        )

        .subscribe();


    /* =====================================================
       INITIAL LOAD
    ===================================================== */

    loadParticipants();

</script>

</body>
</html>
